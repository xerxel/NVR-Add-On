[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cctv_event_timeline"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B"]
ignore = ["E501", "E701", "E702", "S101", "S311", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S106"]
